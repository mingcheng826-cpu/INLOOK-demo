<h1>像素派派隊</h1>
<p>把派派做成像素風的向量圖：小小一隻、放大縮小都不會糊，適合放在 APP 的按鈕、徽章和排行榜旁邊。不同帽子代表不同身分，一眼就認得出誰是隊長、誰是老闆隊。</p>

<h2>派派隊：主人和隊友</h2>
<p>派派不是一個人走。主人時髦小姐帶著牠逛百貨，路上遇到四個甜點朋友，組成「派派隊」。都是台灣人熟悉的甜點，跟派派一樣圓圓胖胖、穿球鞋。</p>
